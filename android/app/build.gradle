plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ratrod.panel'
    compileSdk 34

    defaultConfig {
        applicationId "com.ratrod.panel"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.github.mik3y:usb-serial-for-android:3.8.1'
}

// The phone UI lives in ../web/index.html and is the single source of truth.
// Copy it into the APK's assets on every build so there is nothing to keep in sync.
tasks.register('syncWebUi', Copy) {
    from(rootProject.file('../web')) {
        include 'index.html'
    }
    into 'src/main/assets'
}

tasks.named('preBuild').configure { dependsOn 'syncWebUi' }
