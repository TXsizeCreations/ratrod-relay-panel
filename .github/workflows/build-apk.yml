name: Build APK

# Rebuilds the panel APK from source and attaches it to the release, so the
# downloadable binary always matches the code on main.
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'web/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "${SDKMANAGER}" --licenses > /dev/null || true
          "${SDKMANAGER}" "platforms;android-34" "build-tools;34.0.0"

      - name: Assemble debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --console=plain

      - name: Attach APK to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ratrod-panel-debug.apk
          gh release upload v1.0.0 ratrod-panel-debug.apk --clobber
